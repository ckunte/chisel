{% extends "base.html" %}
{%- block title %}{%- endblock %}
{%- block head -%}
  <link type="text/css" rel="stylesheet" href="/inc/bare.css">
  <script src="/inc/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>  
  <link rel="alternate" type="application/json" title="{{ site_title }}" href="/feed.json">
{%- endblock %}

{%- block post %}
  <h1>{{ site_author }}'s home page</h1>

  {%- for entry in entries %}

  <h2 datetime="{{ entry.feed_date }}">{{ entry.filename }}</h2>
  {{ entry.content }}

  {%- endfor %}

  {% include 'bio.html' %}

{%- endblock %}
