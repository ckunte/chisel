{% extends "base.html" %}
{%- block title %}: {{ site_desc }}{%- endblock %}
{%- block head -%}
  <link type="text/css" rel="stylesheet" href="/css/bare.css">
  <script src="/css/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <link rel="alternate" type="application/json" title="{{ site_title }}: {{ site_desc }}" href="/feed.json">
{%- endblock %}

{%- block post %}
<main>
<header>
  <a href="/w"><img class="logo" src="/img/apple-touch-icon.png" width=56 height=56></a>
</header>
{%- for entry in entries %}
<article>
<time datetime="{{ entry.feed_date }}">{{ entry.filename }}</time>
<h1 id="{{ entry.filename }}">{{ entry.title }}</h1>
{{ entry.content }}
</article>
{%- endfor %}
<footer>
  <span>&larr; <a accesskey="j" href="/">Home</a></span>
  <span>&nbsp;</span>
</footer>
</main>
{%- endblock %}
