{% extends "base.html" %}
{%- block title %}{%- endblock %}
{%- block head -%}
  <link type="text/css" rel="stylesheet" href="/inc/bare.css">
  <script src="/inc/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <link rel="alternate" type="application/json" title="{{ site_title }}: Weeknotes" href="/feed.json">
{%- endblock %}

{%- block post %}
<main>
<header>
  <a href="/"><img src="/inc/apple-touch-icon.png" width=64 height=64></a>
</header>
{%- for entry in entries %}
<article>
<time datetime="{{ entry.feed_date }}">{{ entry.filename }}</time>
<h1 id="{{ entry.filename }}">{{ entry.title }}</h1>
{{ entry.content }}
</article>
{%- endfor %}
<footer>
  <span>&larr; <a href="https://github.com/ckunte">About</a></span>
  <span>Weeknotes</span>
</footer>
</main>
{%- endblock %}
