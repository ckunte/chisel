{% from 'site_settings.jinja2' import site_title, site_url, site_author -%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ site_title }}{% block title %}{% endblock %}</title>
  <meta name="author" content="{{ site_author }}" />
  <meta name="viewport" content="width=device-width">
  <link type="text/css" rel="stylesheet" href="/css/w.css" />
  <link rel="apple-touch-icon-precomposed" href="/img/apple-touch-icon.png" />
  <link rel="alternate" type="application/atom+xml" title="{{ site_title }}:weeknotes" href="/rss.xml" />
</head>
<body>
  <main>
{%- block post -%}{%- endblock %}
  </main>
</body>
</html>
