{% extends "base.html" %}
{%- block title %}{%- endblock %}
{%- block head -%}
  <link type="text/css" rel="stylesheet" href="/incl/h.css">
  <link rel="alternate" type="application/json" title="{{ site_title }}" href="/feed.json">
{%- endblock %}

{%- block post %}
    <article>
      <p><a accesskey="/" href="/"><img class="logotype" alt="" src="/incl/ckunte.png"></a></p>
      {%- for entry in entries %}
      <p datetime="{{ entry.feed_date }}">
        <a accesskey="j" href="/w" title="Note from week {{ entry.week}}, {{ entry.year }}.">
          {{ entry.title }}
        </a>
      </p>
      {%- endfor %}
    </article>
    <footer class="post">
      <span>&nbsp;</span>
      <span>{{ site_title }}</span>
    </footer>
{%- endblock %}
