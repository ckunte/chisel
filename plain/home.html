{% extends "base.html" %}
{%- block title %}{%- endblock %}
{%- block head -%}
  <link type="text/css" rel="stylesheet" href="/incl/h.css">
  <link rel="alternate" type="application/json" title="{{ site_title }}" href="/feed.json">
{%- endblock %}

{%- block post %}
    <article>
      <p><img class="logotype" alt="" src="/incl/ckunte.webp"></p>
      {%- for entry in entries %}
      <p>
        <a accesskey="j" href="/w" title="Note from week {{ entry.filename }}">
          {{ entry.title }}
        </a>
        <time datetime="{{ entry.feed_date }}">{{ entry.filename }}</time>{# (entry.year|string)[-2:] }}W{{ entry.week #}
      </p>
      {%- endfor %}
    </article>
    <footer class="post">
      <span>&nbsp;</span>
      <span>{{ site_title }}</span>
    </footer>
{%- endblock %}
