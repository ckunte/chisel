{% from 'site_settings.jinja2' import site_title, site_url, site_author -%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ site_title }}</title>
  <meta name="viewport" content="width=device-width">
  <link type="text/css" rel="stylesheet" href="/css/h.css" />
  <link rel="apple-touch-icon-precomposed" href="/img/apple-touch-icon.png" />
  <link type="application/atom+xml" rel="alternate" title="{{ site_title }}:weeknotes" href="/rss.xml" />
</head>
<body>
  <main>
    <article>
      <p><a accesskey="/" href="/"><img alt="" src="/img/ckunte.png"></a></p>
      {%- for entry in entries %}
      <p datetime="{{ entry.feed_date }}">
        Hello.{#
          <a accesskey="w" title="Note from week {{ entry.week }}, {{ entry.year }}." href="/w">{{ entry.title }}</a>.#}
      </p>
      {%- endfor %}
    </article>
    <footer class="post">
      <span>&nbsp;</span>
    </footer>
  </main>
</body>
</html>
